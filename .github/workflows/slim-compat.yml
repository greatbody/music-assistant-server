name: Build PortAudio compatibility image
on:
  push:
    branches: [slim-2.9]
    paths: [Dockerfile.compat, .github/workflows/slim-compat.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.compat
          platforms: linux/arm64
          load: true
          tags: music-assistant-compat:smoke
      - name: Check audio dependency and start server
        run: |
          docker run -d --name compat-smoke --network host music-assistant-compat:smoke
          docker exec compat-smoke python -c "import ctypes.util; assert ctypes.util.find_library('portaudio'); import sounddevice"
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8095/ >/dev/null; then break; fi
            sleep 2
          done
          if ! curl --fail --silent http://127.0.0.1:8095/ >/dev/null; then docker logs compat-smoke; exit 1; fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.compat
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/music-assistant-slim:2.9.0-compatible

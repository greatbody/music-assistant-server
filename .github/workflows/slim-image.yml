name: Build slim ARM64 image
on:
  push:
    branches: [slim-2.9]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra test
      - name: Install provider dependencies for full-project type checks
        run: |
          uv pip install --index-strategy unsafe-best-match --extra-index-url https://download.pytorch.org/whl/cpu -r requirements_all.txt \
            'torch==2.11.0+cpu' 'torchaudio==2.11.0+cpu' 'librosa==0.11.0' \
            'beat-this==1.1.0' 'nnAudio==0.3.3' 'torchlibrosa==0.1.0' \
            'transformers==5.6.2' 'huggingface-hub==1.12.0' 'usearch==2.25.3'
      - run: uv run --no-sync pre-commit run --all-files
        env:
          UV_NO_SYNC: 1
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.slim
          platforms: linux/arm64
          load: true
          tags: music-assistant-slim:smoke
      - name: Verify startup and dependency exclusion
        run: |
          docker run -d --name slim-smoke --network host music-assistant-slim:smoke
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8095/ >/dev/null; then break; fi
            sleep 2
          done
          if ! curl --fail --silent http://127.0.0.1:8095/ >/dev/null; then docker logs slim-smoke; exit 1; fi
          docker exec slim-smoke python -c "import importlib.util; assert all(importlib.util.find_spec(n) is None for n in ('torch', 'torchaudio', 'numba', 'llvmlite'))"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.slim
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/music-assistant-slim:2.9.0
            ghcr.io/${{ github.repository_owner }}/music-assistant-slim:latest
